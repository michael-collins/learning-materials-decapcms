[build]
  command = "npm run build"
  publish = ".output/public"
  functions = ".output/server"

[build.environment]
  NODE_VERSION = "20"

# Note: No API keys needed as environment variables
# Users provide their own API keys through the UI
# which are stored in browser localStorage

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

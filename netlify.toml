[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Cache node_modules and .nuxt between builds to avoid reinstalling
# dependencies and regenerating Nuxt internals on every deploy.
[build.cache]
  paths = ["node_modules", ".nuxt"]

# No API keys needed as environment variables
# Users provide their own API keys through the UI
# which are stored in browser localStorage

          - {label: "File", name: "file", widget: "file", required: false, hint: "Upload a file for download"}
          - {label: "External URL", name: "url", widget: "string", required: false, hint: "Or provide an external link"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "lessons"
    label: "Lessons"
    folder: "content/lessons"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index" # Files are stored as {slug}/index.md - version snapshots in v/ subdirectory are automatically excluded
    identifier_field: "slug"
    extension: "md"
    format: "frontmatter"
    view_filters:
      - label: "All"
        field: published
        pattern: ""
      - label: "Published"
        field: published
        pattern: true
      - label: "Unpublished"
        field: published
        pattern: false
    sortable_fields: ["title", "published"]
    sort: {field: "title", direction: "asc"}
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Type", name: "type", widget: "hidden", default: "oer:LearningComponent"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Estimated Duration", name: "estimatedDuration", widget: "string", required: false, hint: "e.g., '3 hours', '2 days'"}
      - label: "Learning Objectives"
        name: "learningObjectives"
        widget: "list"
        required: false
        field: {label: "Objective", name: "objective", widget: "text"}
      - label: "Content Items"
        name: "items"
        widget: "list"
        required: false
        hint: "Add and order content items"
        types:
          - label: "Lecture"
            name: "lectures"
            widget: "object"
            fields:
              - {label: "Type", name: "__typename", widget: "hidden", default: "lectures"}
              - {label: "Lecture", name: "lecture", widget: "relation", required: true, collection: "lectures", value_field: "slug", search_fields: ["title"], display_fields: ["title"]}
          - label: "Tutorial"
            name: "tutorials"
            widget: "object"
            fields:
              - {label: "Type", name: "__typename", widget: "hidden", default: "tutorials"}
              - {label: "Tutorial", name: "tutorial", widget: "relation", required: true, collection: "tutorials", value_field: "slug", search_fields: ["title"], display_fields: ["title"]}
          - label: "Exercise"
            name: "exercises"
            widget: "object"
            fields:
              - {label: "Type", name: "__typename", widget: "hidden", default: "exercises"}
              - {label: "Exercise", name: "exercise", widget: "relation", required: true, collection: "exercises", value_field: "slug", search_fields: ["title"], display_fields: ["title"]}
          - label: "Article"
            name: "articles"
            widget: "object"
            fields:
              - {label: "Type", name: "__typename", widget: "hidden", default: "articles"}
              - {label: "Article", name: "article", widget: "relation", required: true, collection: "articles", value_field: "slug", search_fields: ["title"], display_fields: ["title"]}
          - label: "Project"
            name: "projects"
            widget: "object"
            fields:
              - {label: "Type", name: "__typename", widget: "hidden", default: "projects"}
              - {label: "Project", name: "project", widget: "relation", required: true, collection: "projects", value_field: "slug", search_fields: ["title"], display_fields: ["title"]}
      - {label: "Prerequisites", name: "prerequisites", widget: "list", required: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Author", name: "author", widget: "string", required: false}
      - {label: "Published", name: "published", widget: "boolean", default: true}
      - {label: "Allow Embedding", name: "allowEmbed", widget: "boolean", default: true, required: false}
      - {label: "License", name: "license", widget: "select", required: false, options: ["CC BY 4.0", "CC BY-SA 4.0", "CC BY-NC 4.0", "CC BY-NC-SA 4.0", "CC BY-ND 4.0", "CC BY-NC-ND 4.0", "CC0 1.0", "All Rights Reserved"]}
      - {label: "AI Usage Licenses", name: "aiLicense", widget: "select", required: false, multiple: true, options: ["AIUL-NA", "AIUL-NA-WR", "AIUL-NA-IM", "AIUL-NA-VD", "AIUL-NA-AU", "AIUL-NA-3D", "AIUL-NA-TR", "AIUL-NA-MX", "AIUL-NA-CO", "AIUL-WA", "AIUL-WA-WR", "AIUL-WA-IM", "AIUL-WA-VD", "AIUL-WA-AU", "AIUL-WA-3D", "AIUL-WA-TR", "AIUL-WA-MX", "AIUL-WA-CO", "AIUL-CD", "AIUL-CD-WR", "AIUL-CD-IM", "AIUL-CD-VD", "AIUL-CD-AU", "AIUL-CD-3D", "AIUL-CD-TR", "AIUL-CD-MX", "AIUL-CD-CO", "AIUL-TC", "AIUL-TC-WR", "AIUL-TC-IM", "AIUL-TC-VD", "AIUL-TC-AU", "AIUL-TC-3D", "AIUL-TC-TR", "AIUL-TC-MX", "AIUL-TC-CO", "AIUL-DP", "AIUL-DP-WR", "AIUL-DP-IM", "AIUL-DP-VD", "AIUL-DP-AU", "AIUL-DP-3D", "AIUL-DP-TR", "AIUL-DP-MX", "AIUL-DP-CO", "AIUL-IU", "AIUL-IU-WR", "AIUL-IU-IM", "AIUL-IU-VD", "AIUL-IU-AU", "AIUL-IU-3D", "AIUL-IU-TR", "AIUL-IU-MX", "AIUL-IU-CO"], hint: "Select one or more AI usage policies"}
      - {label: "Version", name: "version", widget: "string", pattern: ["\\d+\\.\\d+\\.\\d+", "Must be semantic version: X.Y.Z"], required: false, hint: "Semantic version (e.g., 1.0.0)"}
      - {label: "Version Status", name: "versionStatus", widget: "select", options: ["latest", "archived", "deprecated"], default: "latest", required: false}
      - {label: "Publish for Embed", name: "publishEmbed", widget: "boolean", default: false, required: false, hint: "Make this version available for embedding"}
      - {label: "Changelog", name: "changelog", widget: "text", required: false, hint: "What changed in this version?"}
      - label: "Breaking Changes"
        name: "breakingChanges"
        widget: "list"
        required: false
        hint: "List any breaking changes"
        field: {label: "Change", name: "change", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "docs"
    label: "Documentation Pages"
    folder: "content/docs"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Document Type", name: "document", widget: "string", default: "page"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "rubrics"
    label: "Assessment Rubrics"
    folder: "content/rubrics"
    create: true
    slug: "{{slug}}"
    identifier_field: "slug"
    fields:
      - {label: "Record ID", name: "recordId", widget: "string", required: false, hint: "Original Airtable record ID (for reference)"}
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string", hint: "Used to reference this rubric in content"}
      - {label: "Description", name: "description", widget: "text"}
      - label: "Grading Criteria"
        name: "criteria"
        widget: "list"
        fields:
          - {label: "Criterion ID", name: "id", widget: "string", required: false, hint: "Original Airtable ID"}
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}

  - name: "resources"
    label: "Resources"
    files:
      - name: "resources"
        label: "Resources List"
        file: "content/data/resources.json"
        fields:
          - label: "Resources"
            name: "resources"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Body", name: "body", widget: "text", required: false, hint: "Additional details"}
              - {label: "Type", name: "type", widget: "select", options: ["artist", "assets", "reference", "collective", "tool", "tutorial", "other"]}
              - label: "Tags"
                name: "tags"
                widget: "list"
                required: false
                allow_add: true
                hint: "Add tags one at a time. Each tag can contain spaces (e.g., '3d animation', 'procedural modeling'). Click 'Add tags' to add each new tag."
                field: {label: "Tag", name: "tag", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - {label: "Alt Text", name: "alt", widget: "string", required: false, hint: "Defaults to name if not provided"}

# Editor configuration
editor:
  preview: true

# Note: Custom editor components are registered via JavaScript in /admin/editor-components.js
# This includes: YouTube Video, Video Embed, Google Slides, Assessment Rubric
